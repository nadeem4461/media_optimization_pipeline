name: Media Optimize PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:

  trigger-optimizer:

    runs-on: self-hosted

    steps:

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ github.head_ref }}" >> $GITHUB_ENV
          echo "REPO_NAME=${{ github.repository }}" >> $GITHUB_ENV

      - name: Render Kubernetes Job Manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
          REPO_NAME: ${{ github.repository }}
        run: |
          sed \
            -e "s|\${PR_NUMBER}|${PR_NUMBER}|g" \
            -e "s|\${BRANCH_NAME}|${BRANCH_NAME}|g" \
            -e "s|\${REPO_NAME}|${REPO_NAME}|g" \
            k8s/optimization-job.yaml.template > k8s/optimization-job.yaml

      - name: Delete old Kubernetes Job
        run: |
          kubectl delete job media-optimize-job-${{ github.event.pull_request.number }} \
            -n media-opt \
            --ignore-not-found=true

      - name: Apply Kubernetes Job
        run: |
          kubectl apply -f k8s/optimization-job.yaml

      - name: Wait for Job Completion
        run: |
          kubectl wait \
            --for=condition=complete \
            --timeout=600s \
            job/media-optimize-job-${{ github.event.pull_request.number }} \
            -n media-opt

      - name: Print Job Logs
        run: |
          POD=$(kubectl get pods \
            -n media-opt \
            -l job-name=media-optimize-job-${{ github.event.pull_request.number }} \
            -o jsonpath="{.items[0].metadata.name}")

          kubectl logs -n media-opt $POD --tail=500

      - name: Commit optimized assets
        run: |
          git config --global user.name "media-optimizer-bot"
          git config --global user.email "bot@mediaoptimizer.ai"

          git add .

          if git diff --cached --quiet; then
            echo "No optimization changes to commit"
          else
            git commit -m "auto optimize images to webp"

            git push origin HEAD:${{ github.head_ref }}

            echo "Optimized assets pushed successfully"
          fi

      - name: Cleanup Kubernetes Job
        if: always()
        run: |
          kubectl delete -f k8s/optimization-job.yaml --ignore-not-found=true